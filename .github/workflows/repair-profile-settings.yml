name: Repair profile settings compile errors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'repair profile settings compile errors') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair profile settings navigation
        shell: python
        run: |
          from pathlib import Path

          profile = Path('lib/screens/profile/profile.dart')
          text = profile.read_text(encoding='utf-8')

          import_line = "import 'settings_pages.dart';\n"
          anchor = "import '../../utils/app_locale.dart';\n"
          if import_line not in text:
              text = text.replace(anchor, anchor + import_line, 1)

          text = text.replace('_PlaybackSettingsPage', 'PlaybackSettingsPage')
          text = text.replace('_NotificationSettingsPage', 'NotificationSettingsPage')
          text = text.replace('_SupportSettingsPage', 'SupportSettingsPage')

          broken = "                ),\n                ),\n                _SettingsRow(\n                  icon: Icons.bolt_outlined,"
          fixed = "                ),\n                _SettingsRow(\n                  icon: Icons.bolt_outlined,"
          if broken in text:
              text = text.replace(broken, fixed, 1)

          profile.write_text(text, encoding='utf-8')

          pages = Path('lib/screens/profile/settings_pages.dart')
          pages.write_text(r'''import 'package:flutter/material.dart';
import 'package:hive_flutter/hive_flutter.dart';

import '../../utils/app_locale.dart';

class PlaybackSettingsPage extends StatefulWidget {
  const PlaybackSettingsPage({super.key});

  @override
  State<PlaybackSettingsPage> createState() => _PlaybackSettingsPageState();
}

class _PlaybackSettingsPageState extends State<PlaybackSettingsPage> {
  late bool autoplay;
  late bool gapless;
  late String repeat;
  late String quality;
  late double crossfade;

  Box<dynamic> get box => Hive.box('profile');

  @override
  void initState() {
    super.initState();
    autoplay = box.get('playbackAutoplay', defaultValue: true) as bool;
    gapless = box.get('playbackGapless', defaultValue: true) as bool;
    repeat = box.get('playbackRepeat', defaultValue: 'off') as String;
    quality = box.get('playbackQuality', defaultValue: 'standard') as String;
    crossfade = (box.get('playbackCrossfade', defaultValue: 0.0) as num).toDouble();
  }

  Future<void> _setBool(String key, bool value, void Function() update) async {
    await box.put(key, value);
    if (mounted) setState(update);
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: Colors.black,
      appBar: AppBar(
        backgroundColor: Colors.black,
        foregroundColor: Colors.white,
        title: Text(AppLocale.text('Воспроизведение', 'Playback')),
      ),
      body: ListView(
        padding: const EdgeInsets.all(20),
        children: [
          _SwitchRow(
            title: AppLocale.text('Автовоспроизведение', 'Autoplay'),
            value: autoplay,
            onChanged: (value) => _setBool('playbackAutoplay', value, () => autoplay = value),
          ),
          const SizedBox(height: 10),
          _SwitchRow(
            title: AppLocale.text('Gapless playback', 'Gapless playback'),
            value: gapless,
            onChanged: (value) => _setBool('playbackGapless', value, () => gapless = value),
          ),
          const SizedBox(height: 10),
          _ChoiceRow(
            title: AppLocale.text('Повтор', 'Repeat'),
            value: repeat,
            items: const {'off': 'Выключен', 'all': 'Очередь', 'one': 'Трек'},
            onChanged: (value) async {
              await box.put('playbackRepeat', value);
              if (mounted) setState(() => repeat = value);
            },
          ),
          const SizedBox(height: 10),
          _ChoiceRow(
            title: AppLocale.text('Качество', 'Quality'),
            value: quality,
            items: const {'standard': 'Стандарт', 'high': 'Высокое', 'maximum': 'Максимальное'},
            onChanged: (value) async {
              await box.put('playbackQuality', value);
              if (mounted) setState(() => quality = value);
            },
          ),
          const SizedBox(height: 10),
          Container(
            padding: const EdgeInsets.fromLTRB(16, 12, 16, 8),
            decoration: BoxDecoration(
              color: const Color(0xFF101010),
              borderRadius: BorderRadius.circular(16),
              border: Border.all(color: const Color(0xFF292929)),
            ),
            child: Column(
              children: [
                Row(
                  children: [
                    Expanded(child: Text('Crossfade', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.w700))),
                    Text('${crossfade.toStringAsFixed(0)} s', style: const TextStyle(color: Color(0xFF858585))),
                  ],
                ),
                Slider(
                  value: crossfade.clamp(0.0, 12.0),
                  min: 0,
                  max: 12,
                  divisions: 12,
                  activeColor: Colors.white,
                  onChanged: (value) {
                    box.put('playbackCrossfade', value);
                    setState(() => crossfade = value);
                  },
                ),
              ],
            ),
          ),
          const SizedBox(height: 10),
          _InfoRow(
            icon: Icons.tune_outlined,
            title: 'EQ',
            subtitle: AppLocale.text(
              'Интерфейс готов; аудио-EQ подключается к движку воспроизведения отдельно.',
              'The UI is ready; audio EQ is wired to the playback engine separately.',
            ),
          ),
        ],
      ),
    );
  }
}

class NotificationSettingsPage extends StatefulWidget {
  const NotificationSettingsPage({super.key});

  @override
  State<NotificationSettingsPage> createState() => _NotificationSettingsPageState();
}

class _NotificationSettingsPageState extends State<NotificationSettingsPage> {
  late bool music;
  late bool downloads;
  late bool updates;

  Box<dynamic> get box => Hive.box('profile');

  @override
  void initState() {
    super.initState();
    music = box.get('notifyMusic', defaultValue: true) as bool;
    downloads = box.get('notifyDownloads', defaultValue: true) as bool;
    updates = box.get('notifyUpdates', defaultValue: true) as bool;
  }

  Future<void> _toggle(String key, bool value, void Function() update) async {
    await box.put(key, value);
    if (mounted) setState(update);
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: Colors.black,
      appBar: AppBar(
        backgroundColor: Colors.black,
        foregroundColor: Colors.white,
        title: Text(AppLocale.text('Уведомления', 'Notifications')),
      ),
      body: ListView(
        padding: const EdgeInsets.all(20),
        children: [
          _SwitchRow(title: AppLocale.text('Музыка', 'Music'), value: music, onChanged: (v) => _toggle('notifyMusic', v, () => music = v)),
          const SizedBox(height: 10),
          _SwitchRow(title: AppLocale.text('Загрузки', 'Downloads'), value: downloads, onChanged: (v) => _toggle('notifyDownloads', v, () => downloads = v)),
          const SizedBox(height: 10),
          _SwitchRow(title: AppLocale.text('Обновления', 'Updates'), value: updates, onChanged: (v) => _toggle('notifyUpdates', v, () => updates = v)),
          const SizedBox(height: 18),
          _InfoRow(
            icon: Icons.info_outline,
            title: AppLocale.text('Системные уведомления', 'System notifications'),
            subtitle: AppLocale.text(
              'Разрешения Android также должны быть включены для показа уведомлений.',
              'Android notification permission must also be enabled for notifications to appear.',
            ),
          ),
        ],
      ),
    );
  }
}

class SupportSettingsPage extends StatelessWidget {
  const SupportSettingsPage({super.key});

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      backgroundColor: Colors.black,
      appBar: AppBar(
        backgroundColor: Colors.black,
        foregroundColor: Colors.white,
        title: Text(AppLocale.text('Поддержка', 'Support')),
      ),
      body: ListView(
        padding: const EdgeInsets.all(20),
        children: [
          _InfoRow(
            icon: Icons.help_outline,
            title: 'FAQ',
            subtitle: AppLocale.text('Ответы на частые вопросы', 'Frequently asked questions'),
          ),
          const SizedBox(height: 10),
          _InfoRow(
            icon: Icons.bug_report_outlined,
            title: AppLocale.text('Сообщить об ошибке', 'Report a bug'),
            subtitle: AppLocale.text('Форма для диагностики и обратной связи', 'Diagnostic and feedback form'),
          ),
          const SizedBox(height: 10),
          _InfoRow(
            icon: Icons.chat_bubble_outline,
            title: AppLocale.text('Обратная связь', 'Feedback'),
            subtitle: AppLocale.text('Связаться с командой FlowLy', 'Contact the FlowLy team'),
          ),
        ],
      ),
    );
  }
}

class _SwitchRow extends StatelessWidget {
  final String title;
  final bool value;
  final ValueChanged<bool> onChanged;

  const _SwitchRow({required this.title, required this.value, required this.onChanged});

  @override
  Widget build(BuildContext context) {
    return Container(
      padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 5),
      decoration: BoxDecoration(
        color: const Color(0xFF101010),
        borderRadius: BorderRadius.circular(16),
        border: Border.all(color: const Color(0xFF292929)),
      ),
      child: Row(
        children: [
          Expanded(child: Text(title, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.w700))),
          Switch(value: value, onChanged: onChanged),
        ],
      ),
    );
  }
}

class _ChoiceRow extends StatelessWidget {
  final String title;
  final String value;
  final Map<String, String> items;
  final ValueChanged<String> onChanged;

  const _ChoiceRow({required this.title, required this.value, required this.items, required this.onChanged});

  @override
  Widget build(BuildContext context) {
    return Container(
      padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 5),
      decoration: BoxDecoration(
        color: const Color(0xFF101010),
        borderRadius: BorderRadius.circular(16),
        border: Border.all(color: const Color(0xFF292929)),
      ),
      child: Row(
        children: [
          Expanded(child: Text(title, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.w700))),
          DropdownButton<String>(
            value: value,
            dropdownColor: const Color(0xFF181818),
            underline: const SizedBox.shrink(),
            style: const TextStyle(color: Colors.white),
            items: items.entries.map((entry) => DropdownMenuItem(value: entry.key, child: Text(entry.value))).toList(),
            onChanged: (next) {
              if (next != null) onChanged(next);
            },
          ),
        ],
      ),
    );
  }
}

class _InfoRow extends StatelessWidget {
  final IconData icon;
  final String title;
  final String subtitle;

  const _InfoRow({required this.icon, required this.title, required this.subtitle});

  @override
  Widget build(BuildContext context) {
    return Container(
      padding: const EdgeInsets.all(16),
      decoration: BoxDecoration(
        color: const Color(0xFF101010),
        borderRadius: BorderRadius.circular(16),
        border: Border.all(color: const Color(0xFF292929)),
      ),
      child: Row(
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          Icon(icon, color: Colors.white),
          const SizedBox(width: 12),
          Expanded(
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                Text(title, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.w700)),
                const SizedBox(height: 4),
                Text(subtitle, style: const TextStyle(color: Color(0xFF858585), height: 1.35)),
              ],
            ),
          ),
        ],
      ),
    );
  }
}
''', encoding='utf-8')

          workflow = Path('.github/workflows/repair-profile-settings.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/profile/profile.dart lib/screens/profile/settings_pages.dart .github/workflows/repair-profile-settings.yml
          git diff --cached --quiet || git commit -m "repair profile settings compile errors"
          git push
