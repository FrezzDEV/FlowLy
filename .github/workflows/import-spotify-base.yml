name: Import Spotify Clone Base

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlowLy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source project
        run: |
          git clone --depth 1 --branch master https://github.com/Mansurisodev/Spotify_clone_provider.git /tmp/spotify_clone
          rm -rf /tmp/spotify_clone/.git

      - name: Replace old FlowLy project
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/spotify_clone/. .

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: replace FlowLy project with Flutter base"
          git push origin HEAD:main
