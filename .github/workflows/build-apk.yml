name: Build FlowLy APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowly-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlowLy
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Flutter compatibility fixes
        run: python3 tool/migrate_flutter_legacy.py

      - name: Resolve Flutter dependencies
        run: flutter --version && flutter pub get

      - name: Patch legacy Android plugin Gradle files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["PUB_CACHE"]) / "hosted" / "pub.dev"
          changed = []

          if root.exists():
              for path in root.rglob("android/build.gradle"):
                  text = path.read_text(encoding="utf-8")
                  patched = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 35", text)
                  if patched != text:
                      path.write_text(patched, encoding="utf-8")
                      changed.append(str(path))

          print("Patched legacy Android plugin SDK declarations:")
          for path in changed:
              print(path)
          PY

      - name: Disable broken Android implementation of assets_audio_player_web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["PUB_CACHE"]) / "hosted" / "pub.dev"
          targets = list(root.glob("assets_audio_player_web-*/pubspec.yaml")) if root.exists() else []

          for path in targets:
              text = path.read_text(encoding="utf-8")
              # assets_audio_player already supplies the Android implementation.
              # The assets_audio_player_web Android shim is legacy code using the
              # removed Flutter V1 Registrar API and must not be registered on Android.
              patched = re.sub(
                  r"(?ms)^\s{6}android:\n(?:^\s{8}.+\n)*",
                  "",
                  text,
                  count=1,
              )
              if patched != text:
                  path.write_text(patched, encoding="utf-8")
                  print(f"Disabled Android platform registration in {path}")

          for path in targets:
              print(f"--- {path} ---")
              print(path.read_text(encoding="utf-8"))
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build FlowLy APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowLy-1.0-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
