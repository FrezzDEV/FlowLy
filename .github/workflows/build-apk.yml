name: Build FlowLy APK

on:
  push:
    branches: ["main", "backup/fc3be491"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flowly-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlowLy
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter --version && flutter pub get

      - name: Patch legacy Android plugin Gradle files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["PUB_CACHE"]) / "hosted" / "pub.dev"
          changed = []

          if root.exists():
              for path in root.rglob("android/build.gradle"):
                  text = path.read_text(encoding="utf-8")
                  patched = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 35", text)
                  if patched != text:
                      path.write_text(patched, encoding="utf-8")
                      changed.append(str(path))

          print("Patched legacy Android plugin SDK declarations:")
          for path in changed:
              print(path)
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build FlowLy APK
        run: flutter build apk --release

      - name: Publish backup APK
        if: github.ref == 'refs/heads/backup/fc3be491'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="backup-fc3be491"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          NAME="flowly-backup-fc3be491.apk"

          test -s "$APK"
          cp "$APK" "$NAME"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FlowLy backup fc3be491" \
              --notes "Test build from backup/fc3be491. This is not a production release." \
              --prerelease
          else
            gh release create "$TAG" "$NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FlowLy backup fc3be491" \
              --notes "Test build from backup/fc3be491. This is not a production release." \
              --prerelease
          fi

      - name: Publish APK as GitHub release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '"' | tr -d "'")
          TAG="v${VERSION%%+*}"
          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"
          echo "Publishing FlowLy ${VERSION} from ${APK}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FlowLy ${VERSION}" \
            --generate-notes
