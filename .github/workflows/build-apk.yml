name: Build FlowLy APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flowly-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlowLy
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter --version && flutter pub get

      - name: Patch legacy Android plugin Gradle files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["PUB_CACHE"]) / "hosted" / "pub.dev"
          changed = []
          if root.exists():
              for path in root.rglob("android/build.gradle"):
                  text = path.read_text(encoding="utf-8")
                  patched = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 35", text)
                  if patched != text:
                      path.write_text(patched, encoding="utf-8")
                      changed.append(str(path))

          print("Patched legacy Android plugin SDK declarations:")
          for path in changed:
              print(path)
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build test APK
        run: flutter build apk --release

      - name: Prepare test APK
        run: cp build/app/outputs/flutter-apk/app-release.apk flowly-test.apk

      - name: Publish latest test APK to GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="test-latest"
          TITLE="FlowLy Test Build"
          NOTES="Automated test APK from commit ${GITHUB_SHA}. GitHub Actions run #${GITHUB_RUN_NUMBER}.\n\nThis is a test build, not a production release. It is signed with the temporary test/debug signing configuration."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" flowly-test.apk \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create "$TAG" flowly-test.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowly-test-apk-${{ github.run_number }}
          path: flowly-test.apk
          if-no-files-found: error
          retention-days: 14
