name: Build FlowLy APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flowly-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlowLy
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure release signing
        env:
          FLOWLY_KEYSTORE_BASE64: ${{ secrets.FLOWLY_KEYSTORE_BASE64 }}
          FLOWLY_KEYSTORE_PASSWORD: ${{ secrets.FLOWLY_KEYSTORE_PASSWORD }}
          FLOWLY_KEY_ALIAS: ${{ secrets.FLOWLY_KEY_ALIAS }}
          FLOWLY_KEY_PASSWORD: ${{ secrets.FLOWLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FLOWLY_KEYSTORE_BASE64"
          test -n "$FLOWLY_KEYSTORE_PASSWORD"
          test -n "$FLOWLY_KEY_ALIAS"

          printf '%s' "$FLOWLY_KEYSTORE_BASE64" | base64 --decode > android/flowly-release.jks
          test -s android/flowly-release.jks

          KEYSTORE_INFO="$(keytool -list -v \
            -keystore android/flowly-release.jks \
            -storepass "$FLOWLY_KEYSTORE_PASSWORD" 2>/dev/null)" || {
            echo "Unable to open release keystore. Check FLOWLY_KEYSTORE_PASSWORD."
            exit 1
          }

          KEYSTORE_TYPE="$(printf '%s\n' "$KEYSTORE_INFO" | sed -n 's/^Keystore type: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          echo "Detected release keystore type: $KEYSTORE_TYPE"

          if [[ "$KEYSTORE_TYPE" == "PKCS12" ]]; then
            EFFECTIVE_KEY_PASSWORD="$FLOWLY_KEYSTORE_PASSWORD"
            echo "Using store password for PKCS12 key password."
          else
            test -n "$FLOWLY_KEY_PASSWORD"
            EFFECTIVE_KEY_PASSWORD="$FLOWLY_KEY_PASSWORD"
          fi

          cat > android/key.properties <<EOF
          storePassword=$FLOWLY_KEYSTORE_PASSWORD
          keyPassword=$EFFECTIVE_KEY_PASSWORD
          keyAlias=$FLOWLY_KEY_ALIAS
          storeFile=flowly-release.jks
          EOF

      - name: Validate release keystore
        env:
          FLOWLY_KEYSTORE_PASSWORD: ${{ secrets.FLOWLY_KEYSTORE_PASSWORD }}
          FLOWLY_KEY_ALIAS: ${{ secrets.FLOWLY_KEY_ALIAS }}
          FLOWLY_KEY_PASSWORD: ${{ secrets.FLOWLY_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_INFO="$(keytool -list -v \
            -keystore android/flowly-release.jks \
            -storepass "$FLOWLY_KEYSTORE_PASSWORD" 2>/dev/null)" || {
            echo "Release keystore cannot be opened. Check FLOWLY_KEYSTORE_PASSWORD."
            exit 1
          }

          KEYSTORE_TYPE="$(printf '%s\n' "$KEYSTORE_INFO" | sed -n 's/^Keystore type: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          echo "Detected release keystore type: $KEYSTORE_TYPE"

          if ! printf '%s\n' "$KEYSTORE_INFO" | grep -Fq "Alias name: $FLOWLY_KEY_ALIAS"; then
            echo "Release key alias was not found in the keystore. Check FLOWLY_KEY_ALIAS."
            exit 1
          fi

          if [[ "$KEYSTORE_TYPE" == "PKCS12" ]]; then
            echo "PKCS12 keystore and alias validated."
          else
            test -n "$FLOWLY_KEY_PASSWORD"
            keytool -exportcert \
              -keystore android/flowly-release.jks \
              -storepass "$FLOWLY_KEYSTORE_PASSWORD" \
              -keypass "$FLOWLY_KEY_PASSWORD" \
              -alias "$FLOWLY_KEY_ALIAS" \
              -rfc >/dev/null || {
                echo "Release key password is invalid. Check FLOWLY_KEY_PASSWORD."
                exit 1
              }
            echo "JKS keystore, alias, store password and key password validated."
          fi

      - name: Resolve Flutter dependencies
        run: flutter --version && flutter pub get

      - name: Patch legacy Android plugin Gradle files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["PUB_CACHE"]) / "hosted" / "pub.dev"
          changed = []

          if root.exists():
              for path in root.rglob("android/build.gradle"):
                  text = path.read_text(encoding="utf-8")
                  patched = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 35", text)
                  if patched != text:
                      path.write_text(patched, encoding="utf-8")
                      changed.append(str(path))

          print("Patched legacy Android plugin SDK declarations:")
          for path in changed:
              print(path)
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build FlowLy APK
        run: flutter build apk --release

      - name: Publish APK as GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '"' | tr -d "'")
          TAG="v${VERSION%%+*}"
          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "Publishing FlowLy ${VERSION} from ${APK}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FlowLy ${VERSION}" \
            --generate-notes
