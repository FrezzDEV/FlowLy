name: Build FlowLy APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flowly-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlowLy
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Flutter compatibility fixes
        run: python3 tool/migrate_flutter_legacy.py

      - name: Persist compatibility fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib tool
            git commit -m "chore: apply Flutter compatibility fixes"
            git push
          fi

      - name: Resolve Flutter dependencies
        run: flutter --version && flutter pub get

      - name: Patch legacy Android plugin Gradle files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["PUB_CACHE"]) / "hosted" / "pub.dev"
          changed = []

          if root.exists():
              for path in root.rglob("android/build.gradle"):
                  text = path.read_text(encoding="utf-8")
                  patched = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 35", text)
                  if patched != text:
                      path.write_text(patched, encoding="utf-8")
                      changed.append(str(path))

          print("Patched legacy Android plugin SDK declarations:")
          for path in changed:
              print(path)
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build FlowLy APK
        run: flutter build apk --release

      - name: Publish APK as GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '"' | tr -d "'")
          TAG="v${VERSION%%+*}"
          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "Publishing FlowLy ${VERSION} from ${APK}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FlowLy ${VERSION}" \
            --generate-notes
