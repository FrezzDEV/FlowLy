name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native platform projects
        run: flutter create --platforms=android,ios --project-name=flowly --org=com.flowly .

      - name: Install dependencies
        run: flutter pub get

      # Keep the prototype source compatible with current Dart typing rules.
      - name: Normalize prototype source
        run: python3 -c "from pathlib import Path; p=Path('lib/main.dart'); s=p.read_text(); s=s.replace('results.length.clamp(0, 8)', 'results.length > 8 ? 8 : results.length'); p.write_text(s)"

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flowly-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
