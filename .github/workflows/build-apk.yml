name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native platform projects
        run: flutter create --platforms=android,ios --project-name=flowly --org=com.flowly .

      - name: Allow network audio on Android release
        run: python3 -c "from pathlib import Path; p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text(); perm='<uses-permission android:name=\"android.permission.INTERNET\"/>\n'; p.write_text(s if 'android.permission.INTERNET' in s else s.replace('<manifest', '<manifest\\n    '+perm, 1))"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flowly-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
