plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('key.properties')
if (!signingPropertiesFile.exists()) {
    throw new GradleException('Missing android/key.properties. Configure the release signing key in CI before building a release APK.')
}
signingPropertiesFile.withInputStream { signingProperties.load(it) }

def requiredSigningProperty = { String name ->
    def value = signingProperties.getProperty(name)
    if (value == null || value.trim().isEmpty()) {
        throw new GradleException("Missing release signing property: ${name}")
    }
    value
}

android {
    namespace 'com.flowly.app'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.flowly.app"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias requiredSigningProperty('keyAlias')
            keyPassword requiredSigningProperty('keyPassword')
            storeFile file(requiredSigningProperty('storeFile'))
            storePassword requiredSigningProperty('storePassword')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
        }
    }
}

flutter {
    source '../..'
}
