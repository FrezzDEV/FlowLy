allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

// Keep legacy Android plugins compatible with the JVM target used by the
// current Android Gradle Plugin and Kotlin Gradle Plugin.
//
// Do not set compileSdk or namespace here: modern AGP may have already read
// those values before the root project is evaluated. Legacy plugin SDK fixes
// are applied in CI before Gradle starts.
subprojects {
    pluginManager.withPlugin("com.android.library") {
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions {
                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
